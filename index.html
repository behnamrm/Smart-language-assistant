<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Language Assistant</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #78716c;
      --line: #d6d3d1;
      --past: #57534e;
      --current: #2563eb;
      --future: #a8a29e;
      --card: #ffffff;
      --backdrop: #d6d3d1;
      --backdrop-sharp: #a8a29e;
      --x: -999px;
      --y: -999px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #44403c;
        --past: #d6d3d1;
        --current: #60a5fa;
        --future: #57534e;
        --card: #292524;
        --backdrop: #44403c;
        --backdrop-sharp: #78716c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Launch date in the background: blurred, sharp only around the pointer */
    .backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 12vh;
      pointer-events: none;
      user-select: none;
      color: var(--backdrop);
      font-weight: 800;
      text-align: center;
      line-height: 0.9;
    }
    .backdrop .label { font-size: clamp(1rem, 3vw, 2rem); letter-spacing: 0.3em; }
    .backdrop .date { font-size: min(14vw, 15rem); letter-spacing: -0.03em; }
    .backdrop.blurred { filter: blur(14px); }
    .backdrop.sharp {
      color: var(--backdrop-sharp);
      -webkit-mask-image: radial-gradient(circle 180px at var(--x) var(--y), #000 30%, transparent 100%);
      mask-image: radial-gradient(circle 180px at var(--x) var(--y), #000 30%, transparent 100%);
    }

    main {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .subtitle { margin: 0 0 48px; color: var(--muted); }

    .timeline {
      display: flex;
      overflow-x: auto;
      padding: 8px 0 16px;
    }
    .phase {
      flex: 1 0 180px;
      position: relative;
      padding: 0 12px;
      text-align: center;
    }
    /* the horizontal line, drawn as one segment per phase */
    .phase::before {
      content: "";
      position: absolute;
      top: 11px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--line);
    }
    .phase:first-child::before { left: 50%; }
    .phase:last-child::before { right: 50%; }
    .phase.past::before { background: var(--past); }
    .phase.current::before { background: linear-gradient(to right, var(--past) 50%, var(--line) 50%); }
    .phase.current:first-child::before { background: var(--line); }

    .dot {
      position: relative;
      width: 24px;
      height: 24px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--future);
    }
    .past .dot { background: var(--past); border-color: var(--past); }
    .current .dot { background: var(--current); border-color: var(--current); }
    .current .dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--current);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(2.6); opacity: 0; }
    }

    .card {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px;
    }
    .current .card {
      background: var(--card);
      border-color: var(--current);
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--current);
    }
    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    .name { margin: 4px 0 2px; font-weight: 600; }
    .future .name { color: var(--muted); }
    .dates { margin: 0; font-size: 0.85rem; color: var(--muted); }

    .survey {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--current);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .survey:hover { transform: translateY(-1px); box-shadow: 0 4px 12px color-mix(in srgb, var(--current) 40%, transparent); }
    .survey:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .current .dot::after, .live::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="backdrop blurred" aria-hidden="true"><span class="label">LAUNCH</span><span class="date">27.01.2027</span></div>
  <div class="backdrop sharp" aria-hidden="true"><span class="label">LAUNCH</span><span class="date">27.01.2027</span></div>

  <main>
    <h1>Smart Language Assistant</h1>
    <p class="subtitle">Project roadmap</p>
    <div class="timeline" id="timeline"></div>
  </main>

  <script>
    // Link for the "Fill the survey" button on the current phase.
    const SURVEY_URL = "#";

    // Edit this list to update the roadmap. Exactly one phase should be "current".
    // "dates" is optional and shown under the phase name.
    const phases = [
      { name: "Research & select theme", status: "past", dates: "Oct 1 – Oct 15, 2026" },
      { name: "User research",           status: "current" },
      { name: "Design",                  status: "future" },
      { name: "Build prototype",         status: "future" },
      { name: "Testing & feedback",      status: "future" },
      { name: "Launch",                  status: "future", dates: "Jan 27, 2027" },
    ];

    const timeline = document.getElementById("timeline");
    for (const p of phases) {
      const el = document.createElement("div");
      el.className = "phase " + p.status;
      el.innerHTML = '<div class="dot"></div><div class="card"></div>';
      const card = el.querySelector(".card");

      if (p.status === "current") {
        card.insertAdjacentHTML("beforeend", '<span class="live">Live · Now</span>');
      }
      const name = document.createElement("p");
      name.className = "name";
      name.textContent = p.name;
      card.appendChild(name);
      if (p.dates) {
        const dates = document.createElement("p");
        dates.className = "dates";
        dates.textContent = p.dates;
        card.appendChild(dates);
      }
      if (p.status === "current") {
        const link = document.createElement("a");
        link.className = "survey";
        link.href = SURVEY_URL;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Fill the survey";
        card.appendChild(link);
      }
      timeline.appendChild(el);
    }

    // Move the sharp spotlight on the background date with the pointer
    const root = document.documentElement;
    const reveal = (x, y) => {
      root.style.setProperty("--x", x + "px");
      root.style.setProperty("--y", y + "px");
    };
    const hide = () => reveal(-999, -999);
    window.addEventListener("pointermove", (e) => reveal(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => reveal(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    document.addEventListener("pointerleave", hide);
    window.addEventListener("touchend", hide);
  </script>
</body>
</html>
