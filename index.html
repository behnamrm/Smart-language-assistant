<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Language Assistant</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #78716c;
      --line: #d6d3d1;
      --past: #57534e;
      --current: #2563eb;
      --future: #a8a29e;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #44403c;
        --past: #d6d3d1;
        --current: #60a5fa;
        --future: #57534e;
        --card: #292524;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .subtitle { margin: 0 0 48px; color: var(--muted); }

    .timeline {
      display: flex;
      overflow-x: auto;
      padding: 8px 0 16px;
    }
    .phase {
      flex: 1 0 180px;
      position: relative;
      padding: 0 12px;
      text-align: center;
    }
    /* the horizontal line, drawn as one segment per phase */
    .phase::before {
      content: "";
      position: absolute;
      top: 11px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--line);
    }
    .phase:first-child::before { left: 50%; }
    .phase:last-child::before { right: 50%; }
    .phase.past::before { background: var(--past); }
    .phase.current::before { background: linear-gradient(to right, var(--past) 50%, var(--line) 50%); }
    .phase.current:first-child::before { background: var(--line); }

    .dot {
      position: relative;
      width: 24px;
      height: 24px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--future);
    }
    .past .dot { background: var(--past); border-color: var(--past); }
    .current .dot {
      background: var(--current);
      border-color: var(--current);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--current) 25%, transparent);
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .current .tag { color: var(--current); }
    .name { margin: 4px 0 2px; font-weight: 600; }
    .future .name { color: var(--muted); }
    .dates { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .card {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px;
    }
    .current .card {
      background: var(--card);
      border-color: var(--current);
    }
  </style>
</head>
<body>
  <main>
    <h1>Smart Language Assistant</h1>
    <p class="subtitle">Project roadmap</p>
    <div class="timeline" id="timeline"></div>
  </main>

  <script>
    // Edit this list to update the roadmap. Dates are YYYY-MM-DD (inclusive).
    // Past / current / future is worked out automatically from today's date.
    const phases = [
      { name: "Research & select theme", start: "2026-10-01", end: "2026-10-15" },
      { name: "Design & planning",       start: "2026-10-16", end: "2026-11-15" },
      { name: "Build prototype",         start: "2026-11-16", end: "2026-12-31" },
      { name: "Testing & feedback",      start: "2027-01-01", end: "2027-01-31" },
      { name: "Launch",                  start: "2027-02-01", end: "2027-02-28" },
    ];

    const parse = (s) => new Date(s + "T00:00:00");
    const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const timeline = document.getElementById("timeline");
    for (const p of phases) {
      const start = parse(p.start), end = parse(p.end);
      const status = end < today ? "past" : start > today ? "future" : "current";
      const label = { past: "Done", current: "Now", future: "Upcoming" }[status];

      const el = document.createElement("div");
      el.className = "phase " + status;
      el.innerHTML = `
        <div class="dot"></div>
        <div class="card">
          <span class="tag">${label}</span>
          <p class="name"></p>
          <p class="dates">${fmt(start)} – ${fmt(end)}</p>
        </div>`;
      el.querySelector(".name").textContent = p.name;
      timeline.appendChild(el);
    }
  </script>
</body>
</html>
